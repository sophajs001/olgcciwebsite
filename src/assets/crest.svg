<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Our Lady of Grace crest">
  <rect x="2" y="2" width="116" height="116" fill="#F6F1E4" stroke="#B4903D" stroke-width="2"/>
  <rect x="10" y="10" width="100" height="100" fill="none" stroke="#1F3E6E" stroke-width="1"/>
  <g transform="translate(60,66)">
    <!-- veil -->
    <path d="M0,-40 C-22,-34 -30,-6 -26,20 C-24,32 -14,40 0,42 C14,40 24,32 26,20 C30,-6 22,-34 0,-40 Z" fill="#1F3E6E"/>
    <!-- face oval -->
    <ellipse cx="0" cy="-16" rx="9" ry="11" fill="#F6F1E4"/>
    <!-- inner robe -->
    <path d="M-14,10 C-14,-2 -8,-8 0,-8 C8,-8 14,-2 14,10 C14,26 8,36 0,38 C-8,36 -14,26 -14,10 Z" fill="#F6F1E4" opacity="0.9"/>
    <!-- hands -->
    <path d="M-3,14 C-3,22 -1,28 0,30 C1,28 3,22 3,14 Z" fill="#1F3E6E"/>
    <!-- halo -->
    <circle cx="0" cy="-24" r="15" fill="none" stroke="#B4903D" stroke-width="1.5" opacity="0.85"/>
  </g>
</svg>
